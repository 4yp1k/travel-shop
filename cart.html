<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Корзина заказов — ТурМагазин">
  <title>Корзина | ТурМагазин</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-airplane-engines me-1"></i> ТурМагазин</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог туров</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
            <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
          </ul>
          <a href="cart.html" class="btn btn-outline-light btn-sm position-relative">
            <i class="bi bi-cart3"></i> Корзина <span class="cart-badge">2</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="section-title">Корзина</h1>

    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cartItems"></div>
        <a href="catalog.html" class="btn btn-outline-primary mt-2"><i class="bi bi-arrow-left"></i> Продолжить выбор</a>
      </div>
      <div class="col-lg-4">
        <div class="card shadow-sm border-0" style="border-radius:12px">
          <div class="card-body">
            <h5 class="card-title">Итого</h5>
            <div class="d-flex justify-content-between mb-2"><span>Путёвки (<span id="cartCount">0</span>)</span><span id="cartSubtotal">0 ₽</span></div>
            <div class="d-flex justify-content-between mb-2 text-success"><span>Скидка</span><span id="cartDiscount">0 ₽</span></div>
            <hr>
            <div class="d-flex justify-content-between fw-bold fs-5 mb-3"><span>К оплате</span><span id="cartTotal">0 ₽</span></div>
            <form>
              <div class="mb-3">
                <label class="form-label">Промокод</label>
                <div class="input-group"><input type="text" class="form-control" placeholder="Введите код"><button class="btn btn-outline-secondary" type="button">OK</button></div>
              </div>
              <button type="button" class="btn btn-accent w-100 btn-lg" data-bs-toggle="modal" data-bs-target="#orderModal" id="checkoutButton">Оформить заказ</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Order modal with validation -->
  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Оформление заказа</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form class="needs-validation" novalidate>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">ФИО <span class="text-danger">*</span></label>
              <input type="text" class="form-control" required minlength="3" pattern="[А-Яа-яЁёA-Za-z\s\-]{3,}" placeholder="Иванов Иван Иванович">
              <div class="invalid-feedback">Укажите ФИО (минимум 3 символа)</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" required placeholder="mail@example.com">
              <div class="invalid-feedback">Введите корректный email</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Телефон <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" required pattern="[\+]?[0-9\s\-\(\)]{10,18}" placeholder="+7 (900) 123-45-67">
              <div class="invalid-feedback">Введите номер телефона</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Комментарий</label>
              <textarea class="form-control" rows="2" maxlength="300"></textarea>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="agree" required>
              <label class="form-check-label" for="agree">Согласен на обработку персональных данных</label>
              <div class="invalid-feedback">Необходимо согласие</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            <button type="submit" class="btn btn-primary">Подтвердить заказ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container text-center">
      <p class="small mb-0">&copy; 2026 ТурМагазин</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Bootstrap validation
    document.querySelectorAll('.needs-validation').forEach(form => {
      form.addEventListener('submit', e => {
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        } else {
          e.preventDefault();
          alert('Заказ успешно оформлен! Мы свяжемся с вами.');
          bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
        }
        form.classList.add('was-validated');
      });
    });
  </script>
</body>
</html>
